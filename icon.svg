<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f" />
      <stop offset="100%" stop-color="#feb47b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with iOS squircle look -->
  <rect width="512" height="512" rx="115" fill="url(#grad)" />
  <!-- Shopping Bag / Cart & Checkmark Symbol -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bag Body -->
    <path d="M120 180 L392 180 L368 400 L144 400 Z" fill="#ffffff" fill-opacity="0.15" />
    <!-- Handle -->
    <path d="M196 180 V130 A60 60 0 0 1 316 130 V180" />
    <!-- Checkmark inside bag -->
    <path d="M210 290 L245 325 L315 255" stroke="#ffffff" stroke-width="32" />
  </g>
</svg>
